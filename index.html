<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Контакти</h1>
    <form id="contactForm">
      <input type="hidden" id="contactIndex" />
      <input type="text" id="firstName" placeholder="Ім'я" required />
      <input type="text" id="lastName" placeholder="Прізвище" required />
      <input type="text" id="phone" placeholder="Телефон" required />
      <input type="email" id="email" placeholder="Електронна пошта" required />
      <button type="submit">Зберегти</button>
    </form>
  
    <div id="contactsList"></div>
    <script src="./index.js"></script>
</body>
</html>
